[project]
name = "orchestcli"
version = "0.1.0"
description = "OrchestCLI - swarm orchestrator connecting Claude Code, Antigravity, Copilot, Ollama, and other models"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=0.3.0",
    "questionary>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
orchest = "orchestrator.cli:main"
orchestcli = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
